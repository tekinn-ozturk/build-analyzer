server:
  port: 8090   # 8080 is left to Jenkins

spring:
  application:
    name: build-analyzer
  # PostgreSQL. The password comes ONLY from the environment (DB_PASSWORD).
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/build_analyzer}
    username: ${DB_USERNAME:build_analyzer_user}
    password: ${DB_PASSWORD:}
  # The schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches the entities.
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# Credentials come ONLY from the environment; never commit real values here.
# Empty username = anonymous access.
jenkins:
  url: ${JENKINS_URL:http://localhost:8080}
  username: ${JENKINS_USERNAME:}
  api-token: ${JENKINS_API_TOKEN:}
  # Console log is decoded as UTF-8; lines that are not valid UTF-8 (a Windows JVM
  # writing in the Turkish code page) are decoded with the fallback charset.
  log-charset: ${JENKINS_LOG_CHARSET:UTF-8}
  log-fallback-charset: ${JENKINS_LOG_FALLBACK_CHARSET:windows-1254}

# Which LlmProvider adapter is active. Only OPENAI exists today; a new provider
# (ANTHROPIC, OLLAMA, ...) is a new adapter gated on its own value.
llm:
  provider: ${LLM_PROVIDER:OPENAI}

# Every value can be overridden with the matching environment variable.
# The API key comes ONLY from the environment (OPENAI_API_KEY); startup fails without it.
openai:
  url: ${OPENAI_URL:https://api.openai.com/v1}
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-5-mini}
  timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:120}
  connect-timeout-seconds: ${OPENAI_CONNECT_TIMEOUT_SECONDS:10}
  # Output cap incl. hidden reasoning tokens; the requested answer itself is a few hundred tokens.
  max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:4000}
  # minimal / low / medium / high. Empty = not sent (model default).
  reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
  # low / medium / high. Empty = not sent. "low" keeps the answer short.
  verbosity: ${OPENAI_VERBOSITY:low}
  # USD per 1M tokens, used only for estimatedCostUsd (gpt-5-mini list price).
  pricing:
    input-usd-per-million: ${OPENAI_INPUT_USD_PER_MILLION:0.25}
    output-usd-per-million: ${OPENAI_OUTPUT_USD_PER_MILLION:2.00}
